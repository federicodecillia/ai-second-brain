<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <rect x="8" y="8" width="1184" height="504" rx="20" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>

  <!-- Title -->
  <text x="600" y="66" text-anchor="middle" font-size="30" font-weight="700" fill="#0F172A">Talk to your vault. Your AI agent files everything.</text>
  <text x="600" y="100" text-anchor="middle" font-size="17" fill="#64748B">One plain-text rulebook. Any agent. A vault that stays organized.</text>

  <!-- ===== Block 1: You ===== -->
  <rect x="56" y="150" width="300" height="250" rx="14" fill="#F8FAFC" stroke="#E2E8F0"/>
  <text x="206" y="184" text-anchor="middle" font-size="14" font-weight="700" letter-spacing="1" fill="#6366F1">YOU, IN PLAIN LANGUAGE</text>
  <rect x="80" y="204" width="252" height="120" rx="14" fill="#FFFFFF" stroke="#E2E8F0"/>
  <text x="98" y="240" font-size="16" fill="#334155">&#8220;Log this call with Anna:</text>
  <text x="98" y="266" font-size="16" fill="#334155">she approved the budget,</text>
  <text x="98" y="292" font-size="16" fill="#334155">review in July.&#8221;</text>
  <text x="206" y="360" text-anchor="middle" font-size="15" font-style="italic" fill="#94A3B8">&#8220;What should I do today?&#8221;</text>

  <!-- Arrow 1 -->
  <text x="403" y="262" text-anchor="middle" font-size="12" fill="#94A3B8">you talk</text>
  <line x1="366" y1="275" x2="436" y2="275" stroke="#94A3B8" stroke-width="3"/>
  <path d="M436 275 L426 269 L426 281 Z" fill="#94A3B8"/>

  <!-- ===== Block 2: Any agent ===== -->
  <rect x="450" y="150" width="300" height="250" rx="14" fill="#F8FAFC" stroke="#E2E8F0"/>
  <text x="600" y="184" text-anchor="middle" font-size="14" font-weight="700" letter-spacing="1" fill="#6366F1">ANY AI AGENT</text>
  <rect x="510" y="208" width="180" height="56" rx="12" fill="#EEF2FF" stroke="#C7D2FE"/>
  <text x="600" y="244" text-anchor="middle" font-size="22" font-weight="700" fill="#4338CA" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">AGENTS.md</text>
  <text x="600" y="290" text-anchor="middle" font-size="13" fill="#64748B">the one file every agent reads</text>
  <g font-size="13" fill="#334155" text-anchor="middle">
    <rect x="465" y="312" width="110" height="30" rx="15" fill="#F1F5F9" stroke="#E2E8F0"/>
    <text x="520" y="331">Claude Code</text>
    <rect x="583" y="312" width="66" height="30" rx="15" fill="#F1F5F9" stroke="#E2E8F0"/>
    <text x="616" y="331">Codex</text>
    <rect x="657" y="312" width="74" height="30" rx="15" fill="#F1F5F9" stroke="#E2E8F0"/>
    <text x="694" y="331">Gemini</text>
  </g>

  <!-- Arrow 2 -->
  <text x="797" y="262" text-anchor="middle" font-size="12" fill="#94A3B8">it files</text>
  <line x1="760" y1="275" x2="830" y2="275" stroke="#94A3B8" stroke-width="3"/>
  <path d="M830 275 L820 269 L820 281 Z" fill="#94A3B8"/>

  <!-- ===== Block 3: PARA vault ===== -->
  <rect x="844" y="150" width="300" height="250" rx="14" fill="#F8FAFC" stroke="#E2E8F0"/>
  <text x="994" y="184" text-anchor="middle" font-size="14" font-weight="700" letter-spacing="1" fill="#6366F1">YOUR PARA VAULT</text>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="600" fill="#0F172A">
    <rect x="864" y="200" width="260" height="34" rx="8" fill="#FFFFFF" stroke="#E2E8F0"/>
    <rect x="880" y="211" width="22" height="13" rx="2" fill="#6366F1"/><rect x="880" y="207" width="10" height="5" rx="1.5" fill="#6366F1"/>
    <text x="914" y="222">01_Projects</text>
    <rect x="864" y="242" width="260" height="34" rx="8" fill="#FFFFFF" stroke="#E2E8F0"/>
    <rect x="880" y="253" width="22" height="13" rx="2" fill="#6366F1"/><rect x="880" y="249" width="10" height="5" rx="1.5" fill="#6366F1"/>
    <text x="914" y="264">02_Areas</text>
    <rect x="864" y="284" width="260" height="34" rx="8" fill="#FFFFFF" stroke="#E2E8F0"/>
    <rect x="880" y="295" width="22" height="13" rx="2" fill="#6366F1"/><rect x="880" y="291" width="10" height="5" rx="1.5" fill="#6366F1"/>
    <text x="914" y="306">03_Resources</text>
    <rect x="864" y="326" width="260" height="34" rx="8" fill="#FFFFFF" stroke="#E2E8F0"/>
    <rect x="880" y="337" width="22" height="13" rx="2" fill="#94A3B8"/><rect x="880" y="333" width="10" height="5" rx="1.5" fill="#94A3B8"/>
    <text x="914" y="348" fill="#475569">09_Archive</text>
  </g>
  <text x="994" y="388" text-anchor="middle" font-size="13" fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">filed, dated, linked</text>

  <!-- Footer pills -->
  <g font-size="14" fill="#475569" text-anchor="middle">
    <rect x="286" y="446" width="190" height="34" rx="17" fill="#F8FAFC" stroke="#E2E8F0"/>
    <text x="381" y="468">Plain markdown + git</text>
    <rect x="492" y="446" width="165" height="34" rx="17" fill="#F8FAFC" stroke="#E2E8F0"/>
    <text x="574" y="468">Syncs to iOS, free</text>
    <rect x="673" y="446" width="241" height="34" rx="17" fill="#F8FAFC" stroke="#E2E8F0"/>
    <text x="793" y="468">No database, no subscription</text>
  </g>
</svg>
